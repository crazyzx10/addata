<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信广告数据管理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #2a2a4a;
        }

        .tab {
            padding: 12px 24px;
            background: #252545;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
            font-size: 16px;
        }

        .tab:hover {
            background: #2a2a5a;
            color: #fff;
        }

        .tab.active {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            background: rgba(37, 37, 69, 0.9);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .tab-content.active {
            display: block;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 20px;
            border-left: 4px solid #00d4ff;
            padding-left: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #c0c0c0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: linear-gradient(135deg, #2a2a5a 0%, #252545 100%);
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }

        button.danger {
            background: linear-gradient(135deg, #ff4757 0%, #cc0000 100%);
            color: #fff;
        }

        .mini-program-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mini-program-card {
            background: #1a1a2e;
            border: 1px solid #3a3a5a;
            border-radius: 10px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
        }

        .log-container {
            background: #0f0f1e;
            border-radius: 10px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-line {
            margin-bottom: 5px;
            padding: 3px 0;
        }

        .log-line.success {
            color: #00ff88;
        }

        .log-line.error {
            color: #ff4757;
        }

        .log-line.info {
            color: #00d4ff;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.completed {
            background: #00ff88;
            color: #1a1a2e;
        }

        .status-badge.pending {
            background: #ffa502;
            color: #1a1a2e;
        }

        .add-form {
            background: #1a1a2e;
            border: 2px dashed #3a3a5a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 微信广告数据管理工具</h1>

        <div class="tabs">
            <button class="tab active" data-tab="database">数据库配置</button>
            <button class="tab" data-tab="mini-program">小程序管理</button>
            <button class="tab" data-tab="execute">数据拉取</button>
        </div>

        <div id="database" class="tab-content active">
            <div id="dbMessage" class="message"></div>
            <div class="section">
                <h2>数据库连接配置</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>主机地址</label>
                        <input type="text" id="dbHost" placeholder="localhost">
                    </div>
                    <div class="form-group">
                        <label>端口</label>
                        <input type="text" id="dbPort" placeholder="3306">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="dbUser" placeholder="root">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="dbPassword" placeholder="password">
                    </div>
                </div>
                <div class="form-group">
                    <label>数据库名</label>
                    <input type="text" id="dbName" placeholder="wechat_ad">
                </div>
                <div class="button-group">
                    <button onclick="testConnection()">测试连接</button>
                    <button onclick="saveDatabaseConfig()">保存配置</button>
                </div>
            </div>
        </div>

        <div id="mini-program" class="tab-content">
            <div id="mpMessage" class="message"></div>
            <div class="section">
                <h2>添加小程序</h2>
                <div class="add-form">
                    <div class="form-group">
                        <label>小程序名称</label>
                        <input type="text" id="mpName" placeholder="我的小程序">
                    </div>
                    <div class="form-group">
                        <label>AppID</label>
                        <input type="text" id="mpAppId" placeholder="wx1234567890abcdef">
                    </div>
                    <div class="form-group">
                        <label>Secret</label>
                        <input type="password" id="mpSecret" placeholder="app secret">
                    </div>
                    <button onclick="addMiniProgram()">添加小程序</button>
                </div>

                <h2>小程序列表</h2>
                <div id="miniProgramList" class="mini-program-list"></div>
            </div>
        </div>

        <div id="execute" class="tab-content">
            <div class="section">
                <h2>拉取数据</h2>
                <div class="button-group">
                    <button id="executeBtn" onclick="executeFetch()">开始拉取</button>
                    <button class="secondary" onclick="clearLog()">清空日志</button>
                </div>
                <div style="margin-top: 20px;">
                    <h3 style="color: #00d4ff; margin-bottom: 10px;">执行日志</h3>
                    <div id="logContainer" class="log-container">
                        <div class="log-line">等待执行...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let config = {
            database: {},
            miniPrograms: []
        };

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                config = await res.json();
                renderConfig();
            } catch (e) {
                console.error(e);
            }
        }

        function renderConfig() {
            if (config.database) {
                document.getElementById('dbHost').value = config.database.host || '';
                document.getElementById('dbPort').value = config.database.port || '';
                document.getElementById('dbUser').value = config.database.user || '';
                document.getElementById('dbPassword').value = config.database.password || '';
                document.getElementById('dbName').value = config.database.dbName || '';
            }
            renderMiniPrograms();
        }

        function renderMiniPrograms() {
            const list = document.getElementById('miniProgramList');
            if (!config.miniPrograms || config.miniPrograms.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#888; padding:40px;">暂无小程序</div>';
                return;
            }
            list.innerHTML = config.miniPrograms.map((mp, index) => `
                <div class="mini-program-card">
                    <div class="card-header">
                        <span class="card-title">${mp.name}</span>
                        <div style="display: flex; gap:10px; align-items: center;">
                            <span class="status-badge ${mp.firstPullComplete ? 'completed' : 'pending'}">
                                ${mp.firstPullComplete ? '已完成首次拉取' : '待首次拉取'}
                            </span>
                            <button class="danger" onclick="deleteMiniProgram(${index})">删除</button>
                        </div>
                    </div>
                    <div style="color:#888; font-size:13px;">
                        <p><strong>AppID:</strong> ${mp.appId}</p>
                    </div>
                </div>
            `).join('');
        }

        function showMessage(el, type, text) {
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        async function testConnection() {
            const dbConfig = {
                database: {
                    host: document.getElementById('dbHost').value,
                    port: document.getElementById('dbPort').value,
                    user: document.getElementById('dbUser').value,
                    password: document.getElementById('dbPassword').value,
                    dbName: document.getElementById('dbName').value
                }
            };
            try {
                const res = await fetch('/api/test-connection', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dbConfig)
                });
                if (res.ok) {
                    showMessage(document.getElementById('dbMessage'), 'success', '连接成功！');
                } else {
                    const err = await res.text();
                    showMessage(document.getElementById('dbMessage'), 'error', '连接失败：' + err);
                }
            } catch (e) {
                showMessage(document.getElementById('dbMessage'), 'error', '请求失败：' + e.message);
            }
        }

        async function saveDatabaseConfig() {
            config.database = {
                host: document.getElementById('dbHost').value,
                port: document.getElementById('dbPort').value,
                user: document.getElementById('dbUser').value,
                password: document.getElementById('dbPassword').value,
                dbName: document.getElementById('dbName').value
            };
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    showMessage(document.getElementById('dbMessage'), 'success', '保存成功！');
                }
            } catch (e) {
                showMessage(document.getElementById('dbMessage'), 'error', '保存失败：' + e.message);
            }
        }

        async function addMiniProgram() {
            const name = document.getElementById('mpName').value;
            const appId = document.getElementById('mpAppId').value;
            const secret = document.getElementById('mpSecret').value;
            if (!name || !appId || !secret) {
                showMessage(document.getElementById('mpMessage'), 'error', '请填写完整信息');
                return;
            }
            config.miniPrograms.push({
                name,
                appId,
                secret,
                firstPullComplete: false
            });
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    document.getElementById('mpName').value = '';
                    document.getElementById('mpAppId').value = '';
                    document.getElementById('mpSecret').value = '';
                    renderMiniPrograms();
                    showMessage(document.getElementById('mpMessage'), 'success', '添加成功！');
                }
            } catch (e) {
                showMessage(document.getElementById('mpMessage'), 'error', '添加失败：' + e.message);
            }
        }

        async function deleteMiniProgram(index) {
            if (!confirm('确定删除该小程序吗？')) return;
            config.miniPrograms.splice(index, 1);
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    renderMiniPrograms();
                    showMessage(document.getElementById('mpMessage'), 'success', '删除成功！');
                }
            } catch (e) {
                showMessage(document.getElementById('mpMessage'), 'error', '删除失败：' + e.message);
            }
        }

        async function executeFetch() {
            const btn = document.getElementById('executeBtn');
            btn.disabled = true;
            btn.textContent = '执行中...';

            const logContainer = document.getElementById('logContainer');
            logContainer.innerHTML = '';

            try {
                const eventSource = new EventSource('/api/execute');
                eventSource.onmessage = (e) => {
                    const line = document.createElement('div');
                    const msg = e.data;
                    line.className = 'log-line';
                    if (msg.includes('成功') || msg.includes('完成')) {
                        line.className += ' success';
                    } else if (msg.includes('失败') || msg.includes('错误')) {
                        line.className += ' error';
                    } else {
                        line.className += ' info';
                    }
                    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
                    logContainer.appendChild(line);
                    logContainer.scrollTop = logContainer.scrollHeight;
                    if (msg === 'DONE') {
                        eventSource.close();
                        btn.disabled = false;
                        btn.textContent = '开始拉取';
                    }
                };
                eventSource.onerror = () => {
                    eventSource.close();
                    btn.disabled = false;
                    btn.textContent = '开始拉取';
                };
            } catch (e) {
                btn.disabled = false;
                btn.textContent = '开始拉取';
            }
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '<div class="log-line">等待执行...</div>';
        }

        loadConfig();
    </script>
</body>
</html>
